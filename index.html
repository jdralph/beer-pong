=%27.55%27/%3E%3Cellipse cx=%27305%27 cy=%27237%27 rx=%2710%27 ry=%276%27 fill=%27%23fff%27 opacity=%27.28%27 transform=%27rotate%28-35 305 237%29%27/%3E%3Ccircle cx=%27124%27 cy=%27370%27 r=%2762%27 fill=%27%23e5412b%27/%3E%3Ccircle cx=%27124%27 cy=%27370%27 r=%2746%27 fill=%27%238f2314%27/%3E%3Ccircle cx=%27124%27 cy=%27370%27 r=%2746%27 fill=%27none%27 stroke=%27%23ff7a63%27 stroke-width=%273%27 opacity=%27.55%27/%3E%3Cellipse cx=%27107%27 cy=%27351%27 rx=%2710%27 ry=%276%27 fill=%27%23fff%27 opacity=%27.28%27 transform=%27rotate%28-35 107 351%29%27/%3E%3Ccircle cx=%27256%27 cy=%27370%27 r=%2762%27 fill=%27%23e5412b%27/%3E%3Ccircle cx=%27256%27 cy=%27370%27 r=%2746%27 fill=%27%238f2314%27/%3E%3Ccircle cx=%27256%27 cy=%27370%27 r=%2746%27 fill=%27none%27 stroke=%27%23ff7a63%27 stroke-width=%273%27 opacity=%27.55%27/%3E%3Cellipse cx=%27239%27 cy=%27351%27 rx=%2710%27 ry=%276%27 fill=%27%23fff%27 opacity=%27.28%27 transform=%27rotate%28-35 239 351%29%27/%3E%3Ccircle cx=%27388%27 cy=%27370%27 r=%2762%27 fill=%27%23e5412b%27/%3E%3Ccircle cx=%27388%27 cy=%27370%27 r=%2746%27 fill=%27%238f2314%27/%3E%3Ccircle cx=%27388%27 cy=%27370%27 r=%2746%27 fill=%27none%27 stroke=%27%23ff7a63%27 stroke-width=%273%27 opacity=%27.55%27/%3E%3Cellipse cx=%27371%27 cy=%27351%27 rx=%2710%27 ry=%276%27 fill=%27%23fff%27 opacity=%27.28%27 transform=%27rotate%28-35 371 351%29%27/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrolling view, fixed bottom tab bar. Draw-sheet ink on a cool court ground, optic-yellow for "ready" moments. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#0e1d33; --muted:#56678a; --line:#d5dde9;
  --court:#b8321f; --court-ink:#ffffff; --ball:#ffb81c; --ball-ink:#2b1a00;
  --win:#12784a; --warn:#9a4d0b; --danger:#b3352a; --shadow:0 1px 2px rgba(14,29,51,.06),0 6px 18px rgba(14,29,51,.06);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09121f; --surface:#101c2f; --surface-2:#0d1728; --ink:#e6ecf6; --muted:#93a3bd; --line:#21304a;
  --court:#ff8f78; --court-ink:#2a0c06; --ball:#ffb81c; --ball-ink:#2b1a00;
  --win:#4fca8f; --warn:#f0a65e; --danger:#ff8a7c; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#09121f; --surface:#101c2f; --surface-2:#0d1728; --ink:#e6ecf6; --muted:#93a3bd; --line:#21304a;
  --court:#ff8f78; --court-ink:#2a0c06; --ball:#ffb81c; --ball-ink:#2b1a00;
  --win:#4fca8f; --warn:#f0a65e; --danger:#ff8a7c; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within .track{outline:2px solid var(--court);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:880px;margin:0 auto;padding:12px 16px 10px;display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
.hdr h1{font-size:26px;font-weight:700;line-height:1.05;text-transform:uppercase}
.hdr .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--win)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--danger)}

/* View */
main{max-width:880px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2,.bk-h h2{font-size:22px;font-weight:700;text-transform:uppercase}
.bk-h p,.hint{margin:0;color:var(--muted);font-size:14px}
h3.rd{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.note{margin:0;font-size:14px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

/* Segmented control */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Match card */
.match{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 9px;box-shadow:var(--shadow)}
button.match:active{transform:scale(.99)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.gno{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.s-ready .chip{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.s-done .chip{color:var(--win)}
.s-ready{border-color:var(--court)}
.s-wait,.s-maybe,.s-skip{background:var(--surface-2);box-shadow:none}
.s-skip{opacity:.6}
.trow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0}
.trow + .trow{border-top:1px solid var(--line)}
.seed{font-size:12px;font-weight:600;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:6px;line-height:20px;height:22px}
.seed.none{border-color:transparent}
.nm{min-width:0;overflow-wrap:anywhere}
.nm b{font-weight:600}
.nm small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.tbd .nm{color:var(--muted);font-style:italic}
.sc{font-family:var(--display);font-size:24px;font-weight:600;min-width:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.won .nm b{font-weight:700}
.won .sc{color:var(--ink)}
.lost .nm{color:var(--muted)}
.tick{color:var(--win);font-weight:700;margin-left:4px}
.mfoot{margin-top:6px;font-size:13px;color:var(--muted)}

/* Banner */
.champ{background:var(--court);color:var(--court-ink);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.champ .eb{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ball)}
:root[data-theme="dark"] .champ .eb{color:var(--court-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .champ .eb{color:var(--court-ink)}}
.champ strong{font-family:var(--display);font-size:34px;line-height:1.05;text-transform:uppercase}
.champ span{font-size:15px;opacity:.85}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:18px;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:14px}
.link{background:none;border:0;padding:6px 0;color:var(--court);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* Empty state */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:24px;text-transform:uppercase}
.empty p{margin:0;color:var(--muted);max-width:36ch}

/* Setup */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step-h{display:flex;gap:10px;align-items:center}
.step-n{font-family:var(--display);font-weight:700;font-size:15px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.step-h h2{font-size:21px;text-transform:uppercase}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-width:0}
textarea{min-height:150px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.teams{display:flex;flex-direction:column;gap:8px}
.team{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tnum{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-align:center;padding-top:8px}
.tfields{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.tfields .tname{grid-column:1/-1}
.tbtns{display:flex;flex-direction:column;gap:4px}
.ic{width:34px;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;display:grid;place-items:center;padding:0;color:var(--muted)}
.ic:disabled{opacity:.35}
.ic svg{width:16px;height:16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;display:grid;grid-template-columns:22px 1fr;gap:4px 10px;align-items:start}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--court);background:var(--surface)}
.opt[aria-pressed="true"] .dot{border-color:var(--court)}
.opt[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--court)}
.opt .ot{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt .od{grid-column:2;color:var(--muted);font-size:14px}
.opt .og{grid-column:2;font-size:13px;font-weight:600;color:var(--ink)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ball);color:var(--ball-ink);padding:2px 7px;border-radius:999px}
.switch{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;grid-row:span 2}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .track{background:var(--court)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch b{font-weight:600}
.switch small{color:var(--muted);font-size:14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.rr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.rr .hint{margin:2px 0 0}
.banner b{color:var(--ink)}
.rrlive .stepper{margin-left:auto}
.hint.md{margin-top:2px;font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .step{width:44px}
.stepper .step:disabled{opacity:.35}
.rcount{font-family:var(--display);font-size:28px;font-weight:700;min-width:34px;text-align:center}
.err{color:var(--danger);font-size:14px;margin:0}
.confirm{border:1px solid var(--danger);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.tm{white-space:normal;min-width:130px}
td.pos{font-family:var(--display);font-weight:700;font-size:18px;width:44px}
.places{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.place{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.place + .place{border-top:1px solid var(--line)}
.place .pl{font-family:var(--display);font-weight:700;font-size:22px}
.place.p1 .pl{color:var(--court)}
.lives{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lives.one{color:var(--warn);border-color:currentColor}
.res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.resrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;width:100%;text-align:left;background:none;border:0}
.resrow + .resrow{border-top:1px solid var(--line)}
.resrow .meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.resrow .line{overflow-wrap:anywhere}
.resrow .score{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--court);background:var(--surface-2)}
.tabs .badge{position:absolute;margin-left:22px;margin-top:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--ball);color:var(--ball-ink);font-size:11px;line-height:18px;padding:0 5px}
.tabs .tb{position:relative;display:flex;flex-direction:column;align-items:center}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,12,24,.5);border:0;padding:0}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.track,.track::after{transition:none}}
.sheet .eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sheet h2{font-size:24px;text-transform:uppercase}
.sheet h3{font-size:17px;text-transform:uppercase;color:var(--muted)}
.sheet h3 small{font-family:var(--body);text-transform:none;font-weight:500;font-size:13px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickbtn{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 10px;min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:center}
.pickbtn b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.pickbtn small{color:var(--muted);font-size:13px}
.pickbtn.on{border-color:var(--court);background:var(--court);color:var(--court-ink)}
.pickbtn.on small{color:inherit;opacity:.85}
.pickbtn .wl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-height:16px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 44px 64px 44px;gap:8px;align-items:center}
.srow + .srow{margin-top:6px}
.srow .snm{overflow-wrap:anywhere;font-weight:600}
.step{height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-size:22px;font-weight:600;padding:0}
.srow input{text-align:center;font-family:var(--display);font-size:24px;font-weight:600;padding:6px 4px;height:44px}
.warn{margin:0;color:var(--warn);font-size:14px;min-height:0}
.warn:empty{display:none}
.sheet .actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;pointer-events:none}
@media (min-width:640px){.hdr h1{font-size:30px}}

select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-width:0}

.tchip{font-variant-numeric:tabular-nums;color:var(--ink)}
.row-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Game timer / clock: amber, red in the last minute */
:root{--on-win:#fff;--low:#d9301f;--low-ink:#fff}

.tmr{border:0;border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:7px;background:var(--ball);color:var(--ball-ink)}

.dw-s.f{border-style:solid;color:var(--ink);font-weight:600;background:var(--surface-2)}
.dw-pot{display:flex;flex-wrap:wrap;gap:6px}
.pp{padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.dw-sub{margin:0;color:var(--muted);font-size:14px}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}

/* ---------- State ---------- */

let S=null; try{S=JSON.parse(lsGet(LS));}catch(e){}

S=norm(S);
const ui={tab:lsGet(LS+":tab")||(S.t?"draw":"setup"),view:"bracket",sheet:null,draft:null,confirm:false,err:"",ps:null,pd:null,pdel:false,perr:"",imp:null,impErr:"",hv:null,hdel:false,bk:false};

/* ---------- Formats ---------- */
const DT={

 5:[["W1","W",1,"s4","s5"],["W2","W",2,"s2","s3"],["W3","W",2,"s1","w:W1"],["L1","L",1,"l:W1","l:W2",5],["W4","W",3,"w:W3","w:W2"],["L2","L",2,"w:L1","l:W3",4],["L3","L",3,"w:L2","l:W4",3],["G1","G",1,"w:W4","w:L3",2]],
 6:[["W1","W",1,"s3","s6"],["W2","W",1,"s4","s5"],["L1","L",1,"l:W1","l:W2",5],["W3","W",2,"s1","w:W2"],["W4","W",2,"s2","w:W1"],["L2","L",1,"l:W3","l:W4",5],["W5","W",3,"w:W3","w:W4"],["L3","L",2,"w:L1","w:L2",4],["L4","L",3,"w:L3","l:W5",3],["G1","G",1,"w:W5","w:L4",2]],
 8:[["W1","W",1,"s1","s8"],["W2","W",1,"s4","s5"],["W3","W",1,"s2","s7"],["W4","W",1,"s3","s6"],["L1","L",1,"l:W1","l:W2",7],["L2","L",1,"l:W3","l:W4",7],["W5","W",2,"w:W1","w:W2"],["W6","W",2,"w:W3","w:W4"],["L3","L",2,"w:L1","l:W6",5],["L4","L",2,"w:L2","l:W5",5],["W7","W",3,"w:W5","w:W6"],["L5","L",3,"w:L3","w:L4",4],["L6","L",4,"w:L5","l:W7",3],["G1","G",1,"w:W7","w:L6",2]]
};
function slotsFor(f,n){if(f==="double")return n<=6?n:8; if(f==="single")return n<=2?2:n<=4?4:8; return n;}
function buildMatches(f,n,o){
  o=o||{};

    const ms=DT[n<=6?n:8].map(([id,bk,rd,a,b,lp])=>({id,bk,rd,a,b,lp:lp||null}));
    if(o.reset) ms.push({id:"G2",bk:"G",rd:2,a:"ga:G1",b:"gb:G1",lp:2,cond:"G1"});

}

/* ---------- Engine: works out who plays whom from results ---------- */
function engine(t){
  const M={}, feeds={}, mS={}, mO={}; let LAD=null;
  t.matches.forEach(m=>{M[m.id]=m;feeds[m.id]={};});
  t.matches.forEach(m=>[m.a,m.b].forEach(r=>{const p=r.split(":"); if((p[0]==="w"||p[0]==="l")&&feeds[p[1]]) feeds[p[1]][p[0]]=m.id;}));
  function ref(r){
    if(r.indexOf(":")<0) return t.slots[+r.slice(1)-1]||BYE;
    const p=r.split(":"), k=p[0], v=p[1];
    if(k==="w"||k==="l"){const o=outcome(v);return o?o[k]:undefined;}
    if(k==="ga"||k==="gb") return sides(v)[k==="ga"?0:1];
    if(k==="r"){const L=ladder();return L.complete?(L.rows[+v-1]||{}).id:undefined;}
  }
  function sides(id){if(mS[id])return mS[id];const m=M[id];return mS[id]=[ref(m.a),ref(m.b)];}
  function needed(m){if(!m.cond)return true;const o=outcome(m.cond);if(!o)return null;return o.w===sides(m.cond)[1];}
  function outcome(id){
    if(id in mO) return mO[id];

    const m=M[id], s=sides(id), a=s[0], b=s[1]; let res;

    else if(a===BYE&&b===BYE) res={w:BYE,l:BYE,bye:true};

    else if(b===BYE&&a!==undefined) res={w:a,l:BYE,bye:true};
    else if(a===undefined||b===undefined) res=undefined;

    if(LAD) return LAD; LAD={rows:[],complete:false,played:0,total:0};

      if(o.draw){st[s[0]].Dr++; st[s[1]].Dr++;}
      else {st[o.w].W++; st[o.l].L++; h2h[o.w+">"+o.l]=(h2h[o.w+">"+o.l]||0)+1;}
      const sa=num(o.r.sa), sb=num(o.r.sb);
      if(sa!=null&&sb!=null){st[s[0]].PF+=sa;st[s[0]].PA+=sb;st[s[1]].PF+=sb;st[s[1]].PA+=sa;}});
    const rows=Object.values(st); rows.forEach(r=>{r.D=r.PF-r.PA; r.Pts=r.W*wp+r.Dr*dp;});
    const key=r=>up?r.Pts:(r.W*100+r.Dr);

      return (y.D-x.D)||(y.PF-x.PF); });

  }
  function stats(){
    const st={}; t.teams.forEach(tm=>st[tm.id]={id:tm.id,P:0,W:0,Dr:0,L:0,PF:0,PA:0});
    t.matches.forEach(m=>{const o=outcome(m.id); if(!o||o.bye) return; const s=sides(m.id);

      if(o.draw){st[s[0]].Dr++;st[s[1]].Dr++;} else {st[o.w].W++;st[o.l].L++;}
      const sa=num(o.r.sa), sb=num(o.r.sb);
      if(sa!=null&&sb!=null){st[s[0]].PF+=sa;st[s[0]].PA+=sb;st[s[1]].PF+=sb;st[s[1]].PA+=sa;}});

        fm.forEach(m=>{if(m.lp&&m.id!=="F1"){const x=outcome(m.id); if(x&&!x.bye) add(x.l,m.lp);}});
        const k=(FIN[fk]&&FIN[fk].team)||2;
        if(L.complete) L.rows.forEach((r,i)=>{if(i>=k) add(r.id,i+1);});
      }
      else if(L.complete) L.rows.forEach((r,i)=>add(r.id,i+1));
    }
    out.sort((a,b)=>a.pl-b.pl);
    out.forEach(p=>p.tie=out.filter(q=>q.pl===p.pl).length>1);
    return out;
  }
  return {M,sides,outcome,status,ladder,stats,gno,dest,placings,needed};
}

/* ---------- Names ---------- */
function displayName(tm,i){const n=(tm.name||"").trim(); if(n) return n; const p=players(tm); return p||("Team "+(i+1));}
function players(tm){return [pn(tm,"p1"),pn(tm,"p2")].filter(Boolean).join(" & ");}
function teamById(t,id){return t.teams.find(x=>x.id===id);}
function tName(t,id){if(id===BYE) return "Bye"; const tm=teamById(t,id); return tm?displayName(tm,t.teams.indexOf(tm)):"?";}
function tSub(t,id){const tm=teamById(t,id); return tm&&(tm.name||"").trim()?players(tm):"";}
function seedOf(t,id){if(t.seeding==="random"||t.format==="rr") return null; const i=t.teams.findIndex(x=>x.id===id); return i<0?null:i+1;}
function roundName(t,m){
  if(m.nm) return m.nm;
  const max=bk=>Math.max.apply(null,t.matches.filter(x=>x.bk===bk).map(x=>x.rd));
  if(m.bk==="G") return m.cond?"Grand Final Reset":"Grand Final";
  if(m.bk==="W") return m.rd===max("W")?"Winners Final":"Winners Round "+m.rd;
  if(m.bk==="L") return m.rd===max("L")?"Losers Final":"Losers Round "+m.rd;
  if(m.bk==="K"){const back=max("K")-m.rd; return back===0?"Final":back===1?"Semi-Finals":back===2?"Quarter-Finals":"Round "+m.rd;}
  if(m.bk==="P") return "3rd Place Playoff";
  if(m.bk==="R") return "Round "+(m.cy||1)+" · Match Day "+(m.md||m.rd);

function describe(E,r){

  if(p[0]==="l") return "Loser of Game "+E.gno[p[1]];

/* ---------- Sync & save ---------- */
function persist(now){

}
function push(){

  sync.chain=sync.chain.then(()=>sync.ref.set(body)).then(()=>setSync("ok")).catch(e=>{
    if(e&&e.code==="invalid_argument"&&!sync.writer){sync.readOnly=true;render();}
    setSync("err");

}
function newer(a,b){return (a.rev||0)>(b.rev||0)||((a.rev||0)===(b.rev||0)&&(a.ts||0)>(b.ts||0));}
function applyRemote(remote){
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest("#view")&&/INPUT|TEXTAREA/.test(ae.tagName)&&ae.type!=="checkbox"){sync.pending=remote;return;}
  sync.pending=null; S=norm(remote); lsSet(LS,JSON.stringify(S));

document.addEventListener("focusout",()=>setTimeout(()=>{const ae=document.activeElement; if(sync.pending&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))) applyRemote(sync.pending);},50));
async function connect(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  let db=null; try{db=await window.claude.use("db");}catch(e){}
  if(!db) return;
  try{const u=await window.claude.use("user"); if(u&&u.can){const c=await u.can("data.write"); if(c===false) sync.readOnly=true; if(c===true) sync.writer=true;}}catch(e){}
  try{sync.ref=db.doc("tournament/current");}catch(e){return;}
  setSync("ok"); let first=true;
  sync.ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    const remote=snap.exists?((snap.data()||{}).state||null):null;
    if(first){first=false;
      if(!remote){ if(!sync.readOnly&&(S.t||S.rev>0)) push(); render(); return; }
      if(!sync.readOnly&&newer(S,remote)&&S.rev>0){push(); render(); return;}
    }
    if(remote&&(sync.readOnly?JSON.stringify(remote)!==JSON.stringify(S):newer(remote,S))) applyRemote(remote);
  },()=>setSync("err"));
  render();
}
function setSync(s){sync.status=s; const el=$("#sync"); if(el) el.outerHTML=syncHTML();}
function syncHTML(){

/* Career stats, worked out from every saved tournament plus the one in progress */
function allTourneys(){const a=(S.history||[]).slice(); if(S.t&&Object.keys(S.t.results).length) a.push(S.t); return a;}
function playerStats(){
  const st={};
  const g=id=>st[id]||(st[id]={id:id,P:0,W:0,D:0,L:0,CF:0,CA:0,CG:0,Ti:0,T:0,BS:0,ev:[],partners:{}});
  allTourneys().forEach(t=>{
    let E; try{E=engine(t);}catch(e){return;}
    const pids=tm=>[tm.p1id,tm.p2id].filter(Boolean);
    t.teams.forEach(tm=>pids(tm).forEach(id=>{g(id).Ti++;}));
    t.matches.forEach(m=>{
      const o=E.outcome(m.id); if(!o||o.bye) return;
      const s=E.sides(m.id), gl=o.r.games?o.r.games:[{sa:o.r.sa,sb:o.r.sb}];   // every game played, including each game of a series
      [0,1].forEach(i=>{
        const tm=t.teams.find(x=>x.id===s[i]); if(!tm) return;
        const win=!o.draw&&o.w===s[i], los=!o.draw&&o.l===s[i], ids=pids(tm);
        ids.forEach(id=>{
          const r=g(id); r.P++; if(win) r.W++; else if(los) r.L++; else r.D++;
          r.ev.push({at:o.r.at||0,w:win});
          gl.forEach(q=>{const a=num(q.sa), b=num(q.sb); if(a!=null&&b!=null){r.CF+=(i===0?a:b); r.CA+=(i===0?b:a); r.CG++;}});
          ids.forEach(o2=>{if(o2!==id){const pp=r.partners[o2]||(r.partners[o2]={P:0,W:0}); pp.P++; if(win) pp.W++;}});
        });
      });
    });
    const champ=E.placings().find(x=>x.pl===1);
    if(champ){const tm=t.teams.find(x=>x.id===champ.id); if(tm) pids(tm).forEach(id=>{g(id).T++;});}
  });
  Object.keys(st).forEach(id=>{   // longest run of wins in a row, oldest match first; a loss or draw ends the run
    const r=st[id]; r.ev.sort((a,b)=>a.at-b.at); let run=0;
    r.ev.forEach(e=>{if(e.w){run++; if(run>r.BS) r.BS=run;} else run=0;});
  });
  return st;
}
const winPct=s=>s&&s.P?Math.round(100*s.W/s.P):0;

function updWarn(){

function saveResult(){

      t.results[id]={a:s[0],b:s[1],w:wa>wb?s[0]:s[1],draw:false,sa:String(ca),sb:String(cb),games:sr.g.slice(),ws:[wa,wb],at:Date.now()};

/* ---------- Game timer (counts down) and game clock (counts up) ---------- */
let TM={}; try{TM=JSON.parse(lsGet(LS+":tm"))||{};}catch(e){TM={};}

const tmLeft=x=>x.running?Math.max(0,x.end-Date.now()):x.left;

  const x=tmGet(id); unlockAudio();
  if(x.mode==="up"){x.running=true; x.st=Date.now(); x.started=true;}
  else{if(tmLeft(x)<=0) x.left=x.mins*60000; x.running=true; x.end=Date.now()+x.left; x.fired=false; x.started=true; x.warned=x.left<=60000;}
  tmSave();
}
function tmPause(id){const x=tmGet(id); if(x.mode==="up") x.el=tmElapsed(x); else x.left=tmLeft(x); x.running=false; tmSave();}
function tmReset(id){const x=tmGet(id); if(x.mode==="up") x.el=0; else {x.left=x.mins*60000; x.fired=false; x.warned=false;} x.running=false; x.started=false; tmSave();}
function tmAdj(id,d){
  const x=tmGet(id); if(x.mode==="up") return;
  const nm=Math.max(1,Math.min(60,x.mins+d)), delta=(nm-x.mins)*60000; x.mins=nm;
  if(x.running) x.end=Math.max(Date.now(),x.end+delta); else x.left=Math.max(0,x.left+delta);
  if(x.fired&&tmLeft(x)>0) x.fired=false;
  if(x.started) x.warned=tmLeft(x)<=60000;
  tmSave();
}
function tick(){
  const now=Date.now(); let fired=null, warn=null;
  Object.keys(TM).forEach(id=>{const x=TM[id]; if(!x||x.mode==="up"||!x.running) return;
    const left=x.end-now;
    if(left<=0){x.running=false; x.left=0; x.fired=true; fired=id;}
    else if(!x.warned&&left<=60000){x.warned=true; warn=id;}});
  document.querySelectorAll("[data-timer]").forEach(el=>{
    const x=TM[el.dataset.timer]; if(!x) return;
    el.textContent=tmDisp(x);
    const box=el.closest("[data-tmbox]"); if(box) box.classList.toggle("low",tmLow(x));
  });
  if(warn){tmSave(); warnBeep(); toast("1 minute left");}
  if(fired){tmSave(); siren(); toast("Time's up!"); render();}
}

/* ---------- Sound and buzz (only after a tap, as phones require) ---------- */
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();}catch(e){}}
function muted(){return lsGet(LS+":mute")==="1";}
function tone(f,d,v,when){
  if(muted()||!AC) return;
  try{const o=AC.createOscillator(),g=AC.createGain(); o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
    const t0=AC.currentTime+(when||0); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v||0.2,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d); o.start(t0); o.stop(t0+d+0.03);}catch(e){}
}
function buzz(p){try{if(navigator.vibrate&&!muted()) navigator.vibrate(p);}catch(e){}}
function warnBeep(){tone(1046,.12,.3,0);tone(1046,.12,.3,.22);tone(1046,.12,.3,.44);tone(1318,.4,.3,.68);buzz([120,80,120,80,120,80,300]);}
function siren(){
  if(!muted()&&AC){
    try{
      const o=AC.createOscillator(), g=AC.createGain(); o.type="sawtooth"; o.connect(g); g.connect(AC.destination);
      const t0=AC.currentTime; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.2,t0+0.05);
      for(let i=0;i<3;i++){o.frequency.setValueAtTime(650,t0+i); o.frequency.linearRampToValueAtTime(1250,t0+i+0.5); o.frequency.linearRampToValueAtTime(650,t0+i+1);}
      g.gain.setValueAtTime(0.2,t0+2.85); g.gain.exponentialRampToValueAtTime(0.0001,t0+3.2); o.start(t0); o.stop(t0+3.3);
    }catch(e){}
  }
  buzz([500,150,500,150,900]);
}

/* ---------- Live draw ---------- */
let DR=null;
const reduced=()=>!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function pickedValid(){const su=S.setup; su.picked=(su.picked||[]).filter(id=>rosterP(id)); return su.picked;}
function drawOpen(){
  const ids=pickedValid(); if(ids.length<4||Math.floor(ids.length/2)>8) return;
  unlockAudio();
  DR={seq:shuffle(ids),mode:S.setup.drawStyle==="tap"?"tap":"auto",rev:0,phase:"intro",tick:null,tm:null};
  document.body.style.overflow="hidden"; renderDraw();
}
function drawStop(){if(DR){clearTimeout(DR.tm);clearInterval(DR.tick);}}
function drawClear(){drawStop(); DR=null; document.body.style.overflow=(ui.sheet||ui.ps)?"hidden":""; renderDraw();}
function drawBegin(){if(!DR) return; unlockAudio(); DR.phase="idle"; renderDraw(); if(DR.mode==="auto") DR.tm=setTimeout(drawNext,700);}
function drawNext(){
  const me=DR; if(!me||me.phase==="spin") return; clearTimeout(me.tm);
  if(me.rev>=me.seq.length){me.phase="done"; renderDraw(); tone(660,.25,.22); tone(880,.4,.22,.2); buzz([60,40,60]); return;}
  const left=me.seq.slice(me.rev), ms=reduced()?0:(left.length>1?1500:800);
  me.phase="spin"; renderDraw();
  const finish=()=>{
    if(DR!==me) return; clearInterval(me.tick); me.rev++; me.phase="landed"; renderDraw(); tone(520,.2,.24); buzz(40);
    if(me.mode==="auto"){me.tm=setTimeout(drawNext,(me.rev%2===0||me.rev>=me.seq.length)?1700:1000);}
  };
  if(ms===0){finish();return;}
  let n=0;
  me.tick=setInterval(()=>{const el=document.getElementById("dw-tick"); if(!el) return; const p=rosterP(left[n++%left.length]); el.textContent=p?pdisp(p):"…"; tone(300+(n%5)*45,.05,.07);},95);
  me.tm=setTimeout(finish,ms);
}
function drawSkip(){if(!DR) return; drawStop(); DR.rev=DR.seq.length; DR.phase="done"; renderDraw();}
function drawAgain(){if(!DR) return; drawStop(); DR.seq=shuffle(DR.seq); DR.rev=0; DR.phase="intro"; renderDraw();}
function drawTeams(){
  const s=DR.seq, n=Math.floor(s.length/2), tms=[];
  for(let i=0;i<n;i++){const a=rosterP(s[2*i]), b=rosterP(s[2*i+1]); tms.push({id:uid(),p1:a?a.name:"",p1id:s[2*i],p2:b?b.name:"",p2id:s[2*i+1],name:""});}
  return {teams:tms,sub:s.length%2?s[s.length-1]:""};
}
function drawUse(){
  if(!DR) return; const r=drawTeams(), su=S.setup;
  su.teams=r.teams; su.sub=r.sub; su.mode="pick"; su.drawn=true;
  drawClear(); persist(true); render(); window.scrollTo(0,0); toast("Teams ready. Pick a format.");
}
function renderDraw(){
  const el=$("#dw"); if(!DR){el.hidden=true;el.innerHTML="";return;}
  el.hidden=false;
  const D=DR, n=Math.floor(D.seq.length/2), odd=D.seq.length%2===1;
  const nm=id=>{const p=rosterP(id); return p?pdisp(p):"?";};
  const top=`<div class="dw-top"><b>Live Draw</b><button class="ic" data-act="dclose" aria-label="Close the draw">${ICONS.x}</button></div>`;
  let body="";
  if(D.phase==="intro"){
    body=`<h1 class="dw-h">${D.seq.length} players, ${n} teams</h1>
      <p class="hint">Players are drawn one at a time. Every two in a row become a team.${odd?" With an odd number, the last player drawn sits out as a sub.":""}</p>
      <div class="seg" role="group" aria-label="Draw style">${[["auto","Auto"],["tap","Tap to Reveal"]].map(([k,l])=>`<button data-act="dmode:${k}" aria-pressed="${D.mode===k}">${l}</button>`).join("")}</div>
      <p class="hint">${D.mode==="auto"?"Auto plays the whole draw by itself.":"You tap for each player, so you set the pace."}</p>
      <button class="btn primary big" data-act="dgo">Start draw</button>
      <button class="link" data-act="snd">${muted()?"Sound is off. Turn on":"Sound is on. Turn off"}</button>`;
  } else if(D.phase==="done"){
    const T=drawTeams();
    body=`<h1 class="dw-h">Teams are set</h1>
      <div class="dw-teams">${T.teams.map((tm,i)=>`<div class="dw-team"><span class="tn">Team ${i+1}</span><span class="dw-s f">${esc(pnf(tm,"p1"))}</span><span class="dw-s f">${esc(pnf(tm,"p2"))}</span></div>`).join("")}</div>
      ${T.sub?`<p class="dw-sub">Sitting out as sub: <b>${esc(nm(T.sub))}</b></p>`:""}
      <button class="btn primary big" data-act="duse">Use these teams</button>
      <div class="row-btns"><button class="btn" data-act="dagain">Draw again</button><button class="btn" data-act="dclose">Close</button></div>`;
  } else {
    const spin=D.phase==="spin", landed=D.phase==="landed";
    const idx=spin?D.rev:D.rev-1;               // which player is on stage
    const tIdx=Math.floor(Math.max(0,idx)/2), isSub=odd&&Math.max(0,idx)===D.seq.length-1;
    const label=isSub?"Sitting out as sub":`Team ${tIdx+1} · Player ${(Math.max(0,idx)%2)+1}`;
    let stage;
    if(spin) stage=`<span class="lab">${label}</span><div class="dw-big" aria-live="off"><span id="dw-tick">…</span></div>`;
    else if(landed) stage=`<span class="lab">${label}</span><div class="dw-big pop">${esc(nm(D.seq[D.rev-1]))}</div>`;
    else stage=`<div class="dw-big">Ready</div><span class="lab">${n} teams to draw</span>`;
    const teams=[]; for(let i=0;i<n;i++){
      const a=2*i, b=2*i+1, cur=(spin||landed)&&tIdx===i&&!isSub;
      const cell=k=>k<D.rev?`<span class="dw-s f ${landed&&k===D.rev-1?"pop":""}">${esc(nm(D.seq[k]))}</span>`:`<span class="dw-s">–</span>`;
      teams.push(`<div class="dw-team ${cur?"cur":""}"><span class="tn">Team ${i+1}</span>${cell(a)}${cell(b)}</div>`);
    }
    if(odd) teams.push(`<div class="dw-team"><span class="tn">Sub</span>${D.rev>=D.seq.length?`<span class="dw-s f pop">${esc(nm(D.seq[D.seq.length-1]))}</span>`:`<span class="dw-s">–</span>`}<span></span></div>`);
    const pot=D.seq.slice(D.rev).sort((x,y)=>nm(x).localeCompare(nm(y)));
    const more=D.rev<D.seq.length;
    const ctl=D.mode==="tap"
      ?`<button class="btn primary big" data-act="dnext" ${spin?"disabled":""}>${spin?"Drawing…":D.phase==="idle"?"Draw first player":more?"Draw next player":"See the teams"}</button>`
      :`<p class="hint" role="status">${spin?"Drawing…":landed&&!more?"All drawn":"Next player coming up"}</p>`;
    body=`<div class="dw-stage">${stage}</div>${ctl}
      <div class="dw-teams">${teams.join("")}</div>
      ${pot.length?`<section><h3 class="rd">Still in the Pot</h3><div class="dw-pot ${spin?"pot-on":""}">${pot.map(id=>`<span class="pp">${esc(nm(id))}</span>`).join("")}</div></section>`:""}
      <button class="link" data-act="dskip">Skip to the end</button>`;
  }
  el.innerHTML=top+`<div class="dw-in">${body}</div>`;
}

  if(R.length<4) return `<div class="empty"><h2>Add your players first</h2><p>The live draw needs at least 4 players in your list. ${R.length?"You have "+R.length+".":""}</p><button class="btn primary" data-act="tab:players">Go to Players</button>${R.length?"":`<button class="link" data-act="samples">Or try 10 sample players</button>`}</div>`;
  const picked=pickedValid(), k=picked.length, n=Math.floor(k/2), ok=k>=4&&n<=8;
  const rows=R.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{const on=picked.includes(p.id);
    return `<button class="resrow prow" data-act="tog:${p.id}" aria-pressed="${on}"><span class="av">${flag(p.nat)||esc(ini(p.name))}</span><span style="min-width:0"><b>${esc(p.name)}</b></span><span class="ck ${on?"on":""}">${on?"✓":""}</span></button>`;}).join("");
  let msg=`${k} selected`; if(k>=2) msg+=`, ${n} team${n===1?"":"s"}`; if(k%2&&k>1) msg+=". One player sits out as a sub."; if(n===2) msg+=". Two teams play a head to head, so pick Single knockout next.";
  let err=""; if(k>0&&k<4) err="Pick at least 4 players to make 2 teams."; else if(n>8) err="This app handles up to 8 teams, so 16 players. Untick a few.";
  return `<p class="hint">Tick everyone playing. Teams of two are drawn live on screen.</p>
    <div class="row-btns"><button class="btn sm" data-act="pall">Select all</button><button class="btn sm" data-act="pnone">Clear</button></div>
    <div class="res">${rows}</div>
    <p class="hint num">${msg}</p>${err?`<p class="err">${err}</p>`:""}
    ${su.drawn&&su.teams.length?`<p class="note">You already have ${realTeams().length} teams. Drawing again replaces them.</p>`:""}
    <button class="btn primary big" data-act="ddraw" ${ok?"":"disabled"}>Start live draw</button>`;
}
function slotSel(tm,k,su){
  const cur=tm[k+"id"]||"", used=new Set();
  su.teams.forEach(x=>{if(x.p1id) used.add(x.p1id); if(x.p2id) used.add(x.p2id);}); used.delete(cur);
  const opts=S.roster.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${p.id===cur?"selected":""} ${used.has(p.id)?"disabled":""}>${esc(pdisp(p))}</option>`).join("");
  return `<select id="f-${tm.id}-${k}" data-sel="slot:${tm.id}:${k}" aria-label="Player ${k==="p1"?1:2}"><option value="">Player ${k==="p1"?1:2}</option>${opts}</select>`;
}
function pickHTML(su){
  if(!S.roster.length) return `<div class="empty"><h2>Add your players first</h2><p>Pick teams from your players list.</p><button class="btn primary" data-act="tab:players">Go to Players</button><button class="link" data-act="samples">Or try 10 sample players</button></div>`;
  const sub=su.sub&&rosterP(su.sub);
  return `<p class="hint">${su.drawn?"Teams from the live draw. Change anyone here.":"Choose two players for each team."}</p>`+teamsEditor(su,"pick")+`<button class="btn" data-act="addteam" ${su.teams.length>=8?"disabled":""}>+ Add team</button>`+(sub?`<p class="note">Sitting out as sub: ${esc(pdisp(sub))}</p>`:"");
}
function teamsEditor(su,mode){
  const list=su.teams;
  return `<div class="teams">${list.map((tm,i)=>`<div class="team"><span class="tnum">${i+1}</span><div class="tfields">
    ${mode==="pick"?slotSel(tm,"p1",su)+slotSel(tm,"p2",su):`<input type="text" id="f-${tm.id}-p1" data-k="team:${tm.id}:p1" value="${esc(tm.p1)}" placeholder="Player 1" aria-label="Team ${i+1} player 1" autocomplete="off">
    <input type="text" id="f-${tm.id}-p2" data-k="team:${tm.id}:p2" value="${esc(tm.p2)}" placeholder="Player 2" aria-label="Team ${i+1} player 2" autocomplete="off">`}
    <input type="text" class="tname" id="f-${tm.id}-name" data-k="team:${tm.id}:name" value="${esc(tm.name)}" placeholder="Team name (optional)" aria-label="Team ${i+1} name" autocomplete="off"></div>
    <div class="tbtns"><button class="ic" data-act="up:${tm.id}" aria-label="Move up" ${i===0?"disabled":""}>${ICONS.up}</button><button class="ic" data-act="down:${tm.id}" aria-label="Move down" ${i===list.length-1?"disabled":""}>${ICONS.down}</button><button class="ic" data-act="rm:${tm.id}" aria-label="Remove team">${ICONS.x}</button></div></div>`).join("")}</div>`;
}
function stp(key,val,min,max,suffix){
  return `<div class="stepper"><button class="step" data-act="adj:${key}:-1:${min}:${max}" aria-label="Decrease" ${val<=min?"disabled":""}>−</button><span class="rcount num">${val}${suffix?`<small>${suffix}</small>`:""}</span><button class="step" data-act="adj:${key}:1:${min}:${max}" aria-label="Increase" ${val>=max?"disabled":""}>+</button></div>`;
}
function rrow(title,desc,ctl){return `<div class="rr"><div style="min-width:0;flex:1 1 120px"><b>${title}</b>${desc?`<p class="hint">${desc}</p>`:""}</div>${ctl}</div>`;}
function rulesHTML(su){
  const rr=su.format==="rr", bo=([3,5].indexOf(+su.bestOf)>=0)?+su.bestOf:1;
  let h=`<section class="card"><div class="step-h"><span class="step-n">${rr?3:4}</span><h2>Game Rules</h2></div>`;
  h+=`<div class="rr" style="flex-direction:column;align-items:stretch"><div><b>Match Length</b><p class="hint">${bo===1?"One game decides each match.":"Each match is a series, scored like sets in tennis. First to "+((bo+1)/2)+" games wins the match."}</p></div><div class="seg" role="group" aria-label="Match length">${[[1,"1 Game"],[3,"Best of 3"],[5,"Best of 5"]].map(([k,l])=>`<button data-act="bo:${k}" aria-pressed="${bo===k}">${l}</button>`).join("")}</div></div>`;
  h+=rrow("Cups Per Game","The winner's score starts here. Go higher for overtime.",stp("cups",+su.cups||6,3,15));
  h+=sw("timer","Game Timer","Count down on each game, with a 1 minute warning and a siren. Off means a clock that counts up.");
  if(su.timer){
    h+=rrow("Default Game Length","You can change it on each game.",stp("timerMins",+su.timerMins||10,1,60," min"));
    if(bo===1) h+=`<div class="opts">`+[["leader","Most Cups Wins","When time is up, the team ahead wins. Level means a draw in round robin, or sudden death in a knockout."],["draw","Unfinished Games Are a Draw","Only a team that sinks every cup wins. Knockout games still need a winner."]].map(([k,l,d])=>`<button class="opt" data-act="tup:${k}" aria-pressed="${(su.timeUp||"leader")===k}"><span class="dot"></span><span class="ot">${l}</span><span class="od">${d}</span></button>`).join("")+`</div>`;
    else h+=`<p class="hint">When time is up, the team ahead wins the game. If level, play sudden death.</p>`;
  }
  if(rr){
    if(bo>1) h+=`<p class="hint">Draws are off in a best-of series. Every game needs a winner.</p>`;
    else h+=su.timer?`<p class="hint">With the timer on, draws are allowed in round robin.</p>`:sw("draws","Allow Draws","Round robin games can finish level.");
    h+=sw("usePoints","Points Table","Rank the ladder by points instead of just wins. Off by default.");
    if(su.usePoints) h+=rrow("Points for a Win","",stp("winPts",+su.winPts||3,1,10))+(bo===1?rrow("Points for a Draw","",stp("drawPts",su.drawPts==null?1:+su.drawPts,0,5)):"");
  } else h+=`<p class="hint">Draws and a points table are for round robin. Knockout games always need a winner.</p>`;
  return h+`</section>`;
}

/* ---------- Round robin finals ---------- */
const FIN={
  none:{name:"No Finals",min:3,team:0,games:0,title:"",sub:"",short:"",desc:"The ladder decides it."},
  gf:{name:"Grand Final",min:2,team:2,games:1,title:"Grand Final",sub:"1v2 on the ladder.",short:"the Grand Final between the top two",desc:"1v2 decides the title."},
  top3:{name:"Top 3 Finals",min:3,team:3,games:2,title:"Finals",sub:"Top three on the ladder. 1st waits in the Grand Final.",short:"top three finals",desc:"2v3. The winner plays 1st in the Grand Final."},
  top4:{name:"Top 4 Finals",min:4,team:4,games:3,title:"Finals",sub:"Top four on the ladder. 1v4 and 2v3.",short:"top four finals",desc:"1v4 and 2v3. The winners play the Grand Final, the losers are out."},
  page:{name:"Page Playoff",min:4,team:4,games:4,title:"Finals",sub:"Page Playoff. Top four on the ladder.",short:"a Page Playoff for the top four",desc:"1v2 and 3v4. The 1v2 winner goes straight to the Grand Final. 3v4 is elimination. The 1v2 loser plays the 3v4 winner for the other spot."},
  top5:{name:"Top 5 Finals",min:5,team:5,games:5,title:"Finals",sub:"Top five on the ladder. 1st gets a bye.",short:"top five finals",desc:"1st gets a bye. 2v3 and 4v5, where 4v5 is elimination. The 2v3 winner plays the 4v5 winner, and the 2v3 loser plays 1st. The winners play the Grand Final."}
};
function finalsMatches(type,n){
  const mk=(id,rd,a,b,o)=>Object.assign({id:id,bk:"F",rd:rd,a:a,b:b,lp:null},o||{});
  if(type==="gf") return [mk("F1",1,"r:1","r:2",{lp:2,nm:"Grand Final"})];
  if(type==="page") return [mk("Q1",1,"r:1","r:2",{nm:"Qualifier 1",sc:true}),mk("EL",1,"r:3","r:4",{nm:"Eliminator",lp:4}),mk("Q2",2,"l:Q1","w:EL",{nm:"Qualifier 2",lp:3}),mk("F1",3,"w:Q1","w:Q2",{nm:"Grand Final",lp:2})];
  if(type==="top4") return [mk("S1",1,"r:1","r:4",{nm:"Semi-Final",lp:3}),mk("S2",1,"r:2","r:3",{nm:"Semi-Final",lp:3}),mk("F1",2,"w:S1","w:S2",{nm:"Grand Final",lp:2})];
  if(type==="top3") return [mk("S1",1,"r:2","r:3",{nm:"Semi-Final",lp:3}),mk("F1",2,"r:1","w:S1",{nm:"Grand Final",lp:2})];
  if(type==="top5") return [mk("S1",1,"r:2","r:3",{nm:"Round 1 · 2nd v 3rd",sc:true}),mk("S2",1,"r:4","r:5",{nm:"Round 1 · 4th v 5th",lp:5}),mk("S3",2,"w:S1","w:S2",{nm:"Round 2",lp:3}),mk("S4",2,"r:1","l:S1",{nm:"Round 2",lp:3}),mk("F1",3,"w:S3","w:S4",{nm:"Grand Final",lp:2})];
  return [];
}
function finalsFor(su,n){const k=FIN[su.finals]?su.finals:"gf"; return (k==="none"||n<3||n>=FIN[k].min)?k:"gf";}
function finalsHTML(su,n){
  const cur=finalsFor(su,n), eff=Math.max(n,3);
  let h=`<div class="rr" style="flex-direction:column;align-items:stretch"><div><b>Finals</b><p class="hint">What happens after the round robin.</p></div><div class="opts">`;
  ["none","gf","top3","top4","page","top5"].forEach(k=>{
    const f=FIN[k]; if(k!=="none"&&f.min>eff) return;
    const g=f.games?`${f.games} Game${f.games>1?"s":""}`:"";
    h+=`<button class="opt" data-act="fin:${k}" aria-pressed="${cur===k}"><span class="dot"></span><span class="ot">${f.name}${k==="gf"?'<span class="tag">Default</span>':""}</span><span class="od">${f.desc}</span>${g?`<span class="og num">${g}</span>`:""}</button>`;
  });
  return h+`</div></div>`;
}

/* ---------- Setup ---------- */
function rrCur(){const v=Math.round(+S.setup.rrCycles); return v>=1?Math.min(4,v):1;}
function rrLive(t){const v=Math.round(+((t.opts||{}).rrCycles)); return v>=1?Math.min(4,v):1;}
function times(c){return c===1?"once":c===2?"twice":c+" times";}
function rrSub(t){const c=rrLive(t); return `${c} round${c===1?"":"s"} (everyone plays everyone ${times(c)})${(()=>{const fk=t.opts.finals||(t.opts.rrFinal?"gf":"none"); return FIN[fk]&&fk!=="none"?", then "+FIN[fk].short:"";})()}. The ladder is on the Results tab.`;}
function stepperHTML(a,cur){return `<div class="stepper"><button class="step" data-act="${a}:-1" aria-label="Fewer rounds" ${cur<=1?"disabled":""}>−</button><span class="rcount num" aria-live="polite">${cur}</span><button class="step" data-act="${a}:1" aria-label="More rounds" ${cur>=4?"disabled":""}>+</button></div>`;}
function rrRoundsHTML(n){
  const cur=rrCur(), per=Math.max(0,n-1)*cur;
  const hint=`A round is everyone playing everyone once. Each team plays every other team ${times(cur)}, ${per} game${per===1?"":"s"} each.`;
  return `<div class="rr"><div style="min-width:0;flex:1 1 200px"><b>Rounds Before the Finals</b><p class="hint">${hint}</p></div>${stepperHTML("rr",cur)}</div>`;
}
function rrLiveHTML(t){
  const n=t.teams.length, cur=rrLive(t), has=Object.keys(t.results).length>0;
  return `<div class="banner rrlive"><div style="min-width:0;flex:1 1 180px"><b>Rounds Before the Finals</b><br><span>Everyone plays everyone ${times(cur)}.${has?" Lowering it removes results from the dropped rounds.":""}</span></div>${stepperHTML("lr",cur)}</div>`;
}
function rrDrawHTML(t,E,ms){
  let h="";
  [...new Set(ms.map(m=>m.cy||1))].sort((a,b)=>a-b).forEach(cy=>{
    h+=`<h3 class="rd">Round ${cy}</h3>`;
    const cm=ms.filter(m=>(m.cy||1)===cy);
    [...new Set(cm.map(m=>m.md||m.rd))].sort((a,b)=>a-b).forEach(md=>{
      const rm=cm.filter(m=>(m.md||m.rd)===md);
      const inR=new Set(); rm.forEach(m=>E.sides(m.id).forEach(x=>inR.add(x)));
      const out=t.slots.filter(x=>x&&!inR.has(x));
      h+=`<p class="hint md">Match Day ${md}${out.length?" · Sitting out: "+out.map(x=>esc(tName(t,x))).join(", "):""}</p><div class="grid">${rm.map(m=>card(t,E,m,false)).join("")}</div>`;
    });
  });
  return h;
}
function suggested(n){return n===2?"single":n<=3?"rr":n<=6?"double":"single";}
function countGames(f,n,o){
  if(n<(f==="single"?2:3)||n>8) return null;
  const t={format:f,teams:[],slots:Array.from({length:slotsFor(f,n)},(_,i)=>i<n?"x"+i:null),matches:buildMatches(f,n,Object.assign({},o,{reset:false})),results:{},opts:{}};
  const E=engine(t); return t.matches.filter(m=>E.status(m.id)!=="bye").length;
}
function byeSlots(f,n){
  if(f==="rr"||n<(f==="single"?2:3)||n>8) return [];
  const t={format:f,teams:[],slots:Array.from({length:slotsFor(f,n)},(_,i)=>i<n?"x"+i:null),matches:buildMatches(f,n,{}),results:{},opts:{}};
  const E=engine(t); return byeTeams(t,E).map(x=>+x.slice(1)+1);
}
function realTeams(){return S.setup.teams.filter(x=>(x.p1||"").trim()||(x.p2||"").trim()||(x.name||"").trim()||x.p1id||x.p2id);}
function viewSetup(t,E){
  if(t) return setupLive(t,E);
  const su=S.setup, n=realTeams().length;
  let h="";
  h+=`<section class="card"><label class="f" for="f-name">Tournament name<input type="text" id="f-name" data-k="name" value="${esc(su.name)}" placeholder="e.g. Saturday Doubles" autocomplete="off"></label></section>`;
  // Step 1
  const md=su.mode==="pick"||su.mode==="type"?su.mode:"roster";
  h+=`<section class="card"><div class="step-h"><span class="step-n">1</span><h2>Teams</h2></div>
    <div class="seg" role="group" aria-label="How to make teams">${[["roster","Live Draw"],["pick","Pick Teams"],["type","Type Names"]].map(([k,l])=>`<button data-act="mode:${k}" aria-pressed="${md===k}">${l}</button>`).join("")}</div>`;
  if(md==="roster") h+=rosterDrawHTML(su);
  else if(md==="pick") h+=pickHTML(su);
  else h+=`<p class="hint">For guests who aren't in your players list. ${su.seeding==="random"?"Order doesn't matter for a random draw.":"List order is the seeding. Team 1 is the top seed."}</p>`+teamsEditor(su,"type")+`<button class="btn" data-act="addteam" ${su.teams.length>=8?"disabled":""}>+ Add team</button>`;
  h+=`</section>`;
  return h+`<div id="setup-b" style="display:flex;flex-direction:column;gap:22px">${setupB()}</div>`;
}
function setupB(){
  const su=S.setup, n=realTeams().length; let h="";
  // Step 2
  const sg=suggested(n);
  h+=`<section class="card"><div class="step-h"><span class="step-n">2</span><h2>Format</h2></div><div class="opts">`;
  [["double","Double Knockout","Out after two losses. Every team plays at least twice."],["single","Single Knockout","Tennis style. Lose once and you're out. Quickest."],["rr","Round Robin","Everyone plays everyone. The ladder decides it."]].forEach(([k,l,d])=>{
    const c=countGames(k,n,{third:su.third,finals:finalsFor(su,n),rrCycles:rrCur()});
    let g=c==null?"":`${c} games`;
    if(k==="double"&&c!=null&&su.reset) g=`${c} games, or ${c+1} if the Grand Final Resets`;
    h+=`<button class="opt" data-act="fmt:${k}" aria-pressed="${su.format===k}"><span class="dot"></span><span class="ot">${l}${n>=2&&n<=8&&sg===k?'<span class="tag">Suggested</span>':""}</span><span class="od">${d}</span>${g?`<span class="og num">${g} with ${n} teams</span>`:""}</button>`;
  });
  h+=`</div>`;
  if(su.format==="double") h+=sw("reset","Grand Final Reset","If the losers-bracket team wins the Grand Final, play one more game so the champion is decided by two losses.");
  if(su.format==="single") h+=sw("third","3rd Place Playoff","Semi-final losers play off for 3rd.");
  if(su.format==="rr") h+=finalsHTML(su,n)+rrRoundsHTML(n);
  h+=`</section>`;
  // Step 3
  if(su.format!=="rr"){
    h+=`<section class="card"><div class="step-h"><span class="step-n">3</span><h2>Draw</h2></div><div class="opts">`;
    [["random","Random Draw","No seeds. Teams are shuffled when you create the draw."],["seeded","Seeded","Team 1 in your list is the top seed. Top seeds get the byes."],["reverse","Reverse Seeded","Team 1 is still the top seed, but the lowest seeds get the byes, so the best teams play the extra game."]].forEach(([k,l,d])=>{
      h+=`<button class="opt" data-act="seed:${k}" aria-pressed="${su.seeding===k}"><span class="dot"></span><span class="ot">${l}</span><span class="od">${d}</span></button>`;});
    h+=`</div>`;
    const bs=byeSlots(su.format,n);
    if(bs.length){
      const rt=realTeams();
      let txt;
      if(su.seeding==="random") txt=`${bs.length} team${bs.length>1?"s get a bye":" gets a bye"} into round 2, picked at random.`;
      else {const seeds=bs.map(s=>su.seeding==="reverse"?n+1-s:s).sort((a,b)=>a-b);
        txt=`Byes into round 2: ${seeds.map(sd=>esc(displayName(rt[sd-1],sd-1))+" (#"+sd+")").join(", ")}.`;}
      h+=`<p class="note">${txt}</p>`;
    } else if(n>=2&&n<=8) h+=`<p class="note">No byes with ${n} teams. Everyone plays in round 1.</p>`;
    h+=`</section>`;
  }
  h+=rulesHTML(su);
  const fmin=su.format==="single"?2:3;
  let errMsg=n<fmin?(n===2?"Double knockout and round robin need 3 or more teams. Pick single knockout for a head to head.":"Add at least "+fmin+" teams to make a draw."):n>8?"This app handles up to 8 teams.":"";
  h+=`<section>${errMsg?`<p class="err">${errMsg}</p>`:""}${ui.err?`<p class="err">${esc(ui.err)}</p>`:""}<button class="btn primary big" data-act="create" ${errMsg?"disabled":""}>Create draw</button></section>`;
  return h;
}
function sw(k,title,desc){return `<label class="switch" for="o-${k}"><input type="checkbox" id="o-${k}" data-opt="${k}" ${S.setup[k]?"checked":""}><span class="track"></span><b>${title}</b><small>${desc}</small></label>`;}
function parseNames(s){return (s||"").split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);}
function pcountText(c){if(!c) return "No names yet."; const tms=Math.floor(c/2); return `${c} player${c===1?"":"s"} → ${tms} team${tms===1?"":"s"}${c%2?". Odd number, so one player won't have a partner yet.":""}`;}
function setupLive(t,E){

      <div class="place"><span class="hint">Options</span><span>${t.format==="double"?(t.opts.reset?"Grand Final Reset: On":"Grand Final Reset: Off"):t.format==="single"?(t.opts.third?"3rd Place Playoff":"No 3rd Place Playoff"):rrSub(t).split(". ")[0]+(t.opts.rrFinal?"":" · no finals")}</span><span></span></div>
      <div class="place"><span class="hint">Rules</span><span>${esc(rules.join(" · "))}</span><span></span></div>

  if(!ro){
    if(t.format==="rr") h+=rrLiveHTML(t);
    h+=`<section class="card"><label class="f" for="f-tname">Tournament name<input type="text" id="f-tname" data-k="tname" value="${esc(t.name)}" autocomplete="off"></label></section>`;
    h+=`<section class="card"><div class="sec-h"><h2>Team Names</h2><span class="hint">Fix spelling any time</span></div><div class="teams">${t.teams.map((tm,i)=>`<div class="team" style="grid-template-columns:28px minmax(0,1fr)"><span class="tnum">${t.seeding==="random"||t.format==="rr"?"·":i+1}</span><div class="tfields">
      ${tm.p1id||tm.p2id?`<div class="lp" style="grid-column:1/-1">${esc(players(tm))}</div>`:`<input type="text" id="g-${tm.id}-p1" data-k="tteam:${tm.id}:p1" value="${esc(tm.p1)}" placeholder="Player 1" aria-label="Player 1" autocomplete="off">
      <input type="text" id="g-${tm.id}-p2" data-k="tteam:${tm.id}:p2" value="${esc(tm.p2)}" placeholder="Player 2" aria-label="Player 2" autocomplete="off">`}
      <input type="text" class="tname" id="g-${tm.id}-name" data-k="tteam:${tm.id}:name" value="${esc(tm.name)}" placeholder="Team name (optional)" aria-label="Team name" autocomplete="off"></div></div>`).join("")}</div></section>`;
    h+=`<section class="card"><div class="sec-h"><h2>Start Again</h2></div>`;
    if(ui.confirm) h+=`<div class="confirm"><p>Save the results to your players' stats, or throw them away. Either way the draw is cleared and your teams stay in Setup so you can reuse them.</p><div class="row-btns"><button class="btn danger" data-act="newgo">Save and start again</button><button class="btn danger" data-act="newdrop">Don't save, start again</button><button class="btn" data-act="newno">Keep this tournament</button></div></div>`;
    else h+=`<p class="hint">Finished, or want a different format? Start a new tournament with the same teams.</p><div><button class="btn danger" data-act="new">Start a new tournament</button></div>`;
    h+=`</section>`;
  } else h+=`<p class="note">View only. The organiser runs the draw from their phone.</p>`;
  return h;
}

/* ---------- Actions ---------- */
function makeSlots(f,seeding,teams){
  let order=teams.map(x=>x.id);
  if(seeding==="random"||f==="rr") order=shuffle(order);
  else if(seeding==="reverse") order=order.slice().reverse();
  return Array.from({length:slotsFor(f,teams.length)},(_,i)=>order[i]||null);
}
function createT(){
  const su=S.setup, teams=clone(realTeams()), n=teams.length;
  const mn=su.format==="single"?2:3; if(n<mn||n>8){ui.err="Use between "+mn+" and 8 teams.";render();return;}
  ui.err="";
  const rr=su.format==="rr", bo=([3,5].indexOf(+su.bestOf)>=0)?+su.bestOf:1, fin=rr?finalsFor(su,n):"none";
  const opts={reset:!!su.reset,third:!!su.third,rrFinal:fin!=="none",finals:fin,rrCycles:rr?rrCur():null,bestOf:bo,cups:Math.max(3,Math.min(15,Math.round(+su.cups)||6)),timer:!!su.timer,timerMins:Math.max(1,Math.min(60,Math.round(+su.timerMins)||10)),timeUp:(su.timeUp==="draw"&&bo===1)?"draw":"leader",draws:rr&&bo===1&&(!!su.draws||!!su.timer),usePoints:rr&&!!su.usePoints,winPts:Math.max(0,Math.round(+su.winPts)||3),drawPts:Math.max(0,Math.round(+su.drawPts)||0)};
  const seeding=su.format==="rr"?"random":su.seeding;
  S.t={name:su.name||"Tournament",format:su.format,seeding,opts,teams,slots:makeSlots(su.format,seeding,teams),matches:buildMatches(su.format,n,opts),results:{},series:{},created:Date.now()};
  TM={}; tmSave(); persist(true); setTab("draw"); toast("Draw created");
}
function prune(t){
  for(let k=0;k<60;k++){const E=engine(t); let ch=false;
    Object.keys(t.results).forEach(id=>{const r=t.results[id], s=E.sides(id), st=E.status(id);
      if(r.a!==s[0]||r.b!==s[1]||st==="skip"||st==="bye"){delete t.results[id];ch=true;}});
    if(t.series) Object.keys(t.series).forEach(id=>{const sr=t.series[id], s=E.sides(id); if(!sr||!sr.g||!sr.g.length||sr.a!==s[0]||sr.b!==s[1]||E.status(id)!=="ready"){delete t.series[id];ch=true;}});
    if(!ch) break;}
}
function setTab(k){ui.tab=k;ui.hv=null;ui.hdel=false;lsSet(LS+":tab",k);ui.confirm=false;render();window.scrollTo(0,0);}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  const p=el.dataset.act.split(":"), a=p[0], su=S.setup;
  switch(a){
    case "tab": setTab(p[1]); break;
    case "view": ui.view=p[1]; render(); break;
    case "open": openSheet(p[1]); break;
    case "cancel": closeSheet(); break;
    case "w": {const t=S.t, s=engine(t).sides(ui.sheet), d=ui.draft, nw=p[1]==="draw"?"draw":s[+p[1]];
      if(nw==="draw"&&!drawOK(t,ui.sheet)) break;
      if(d.w&&d.w!=="draw"&&nw!=="draw"&&d.w!==nw){const a=d.s0,b=d.t0; d.s0=d.s1; d.s1=a; d.t0=d.t1; d.t1=b;}
      d.w=nw; d.auto=false; stopTimer(ui.sheet); applyWin(); renderSheet(); break;}
    case "inc": {const k="s"+p[1], v=num(ui.draft[k])||0; ui.draft[k]=String(Math.max(0,v+(+p[2]))); ui.draft["t"+p[1]]=true; autoPick(); renderSheet(); break;}
    case "save": saveResult(); break;
    case "clear": delete S.t.results[ui.sheet]; if(S.t.series) delete S.t.series[ui.sheet]; delete TM[ui.sheet]; tmSave(); prune(S.t); closeSheet(true); persist(true); render(); toast("Result cleared"); break;
    case "redraw": if(!Object.keys(S.t.results).length){S.t.slots=makeSlots(S.t.format,S.t.seeding,S.t.teams); persist(true); render(); toast("New draw made");} break;
    case "mode": su.mode=p[1]; persist(); render(); break;
    case "clearex": su.teams=blankTeams(4); S.example=false; persist(); render(); break;
    case "addteam": if(su.teams.length<8){su.teams.push({id:uid(),p1:"",p2:"",name:""}); persist(); render(); const nt=su.teams[su.teams.length-1]; const f=document.getElementById("f-"+nt.id+"-p1"); f&&f.focus();} break;
    case "rm": su.teams=su.teams.filter(x=>x.id!==p[1]); S.example=false; persist(); render(); break;
    case "up": case "down": {const i=su.teams.findIndex(x=>x.id===p[1]), j=a==="up"?i-1:i+1; if(i>=0&&j>=0&&j<su.teams.length){const tmp=su.teams[i];su.teams[i]=su.teams[j];su.teams[j]=tmp; persist(); render();} break;}
    case "rr": su.rrCycles=Math.max(1,Math.min(4,rrCur()+(+p[1]))); persist(); render(); break;
    case "lr": {const t=S.t; if(!t||t.format!=="rr"||sync.readOnly) break;
      const n=t.teams.length, cur=rrLive(t), nv=Math.max(1,Math.min(4,cur+(+p[1]))); if(nv===cur) break;
      const before=Object.keys(t.results).length;
      t.opts.rrCycles=nv; t.matches=buildMatches("rr",n,t.opts);
      Object.keys(t.results).forEach(id=>{if(!t.matches.some(m=>m.id===id)) delete t.results[id];});
      prune(t); const lost=before-Object.keys(t.results).length;
      persist(true); render(); toast(nv+" round"+(nv===1?"":"s")+(lost?" · "+lost+" result"+(lost===1?"":"s")+" removed":"")); break;}
    case "fmt": su.format=p[1]; persist(); render(); break;
    case "seed": su.seeding=p[1]; persist(); render(); break;
    case "create": createT(); break;
    case "new": ui.confirm=true; render(); break;
    case "newno": ui.confirm=false; render(); break;
    case "newgo": case "newdrop": {const saved=a==="newgo"&&Object.keys(S.t.results).length>0; if(saved) S.history.push(clone(S.t));
      su.teams=clone(S.t.teams); su.name=S.t.name; su.mode=su.teams.some(x=>x.p1id||x.p2id)?"pick":"type"; su.drawn=false; S.example=false; S.t=null; TM={}; tmSave(); ui.confirm=false; closeSheet(true); persist(true); setTab("setup"); if(saved){ui.bk=true; document.body.style.overflow="hidden"; renderSheet();} else toast(a==="newgo"?"Ready for a new draw":"Not saved. Ready for a new draw"); break;}
    case "adj": if(["cups","timerMins","winPts","drawPts"].indexOf(p[1])>=0){su[p[1]]=Math.max(+p[3],Math.min(+p[4],(+su[p[1]]||0)+(+p[2]))); persist(); render();} break;
    case "tup": su.timeUp=p[1]==="draw"?"draw":"leader"; persist(); render(); break;
    case "ps": openPS(p[1]); break;
    case "psave": savePlayer(); break;
    case "pdel": ui.pdel=true; renderSheet(); break;
    case "pdelno": ui.pdel=false; renderSheet(); break;
    case "pdelgo": deletePlayer(); break;
    case "samples": addSamples(); break;
    case "tog": {const i=su.picked.indexOf(p[1]); if(i<0) su.picked.push(p[1]); else su.picked.splice(i,1); persist(); render(); break;}
    case "pall": su.picked=S.roster.map(x=>x.id); persist(); render(); break;
    case "pnone": su.picked=[]; persist(); render(); break;
    case "ddraw": drawOpen(); break;
    case "dmode": su.drawStyle=p[1]==="tap"?"tap":"auto"; if(DR) DR.mode=su.drawStyle; persist(); renderDraw(); break;
    case "dgo": drawBegin(); break;
    case "dnext": drawNext(); break;
    case "dskip": drawSkip(); break;
    case "dagain": drawAgain(); break;
    case "duse": drawUse(); break;
    case "dclose": drawClear(); break;
    case "snd": lsSet(LS+":mute",muted()?"0":"1"); unlockAudio(); renderDraw(); render(); break;
    case "tmstart": tmStart(ui.sheet); render(); break;
    case "tmpause": tmPause(ui.sheet); render(); break;
    case "tmreset": tmReset(ui.sheet); render(); break;
    case "tmadj": tmAdj(ui.sheet,+p[1]); render(); break;
    case "callit": callIt(); break;
    case "expo": exportData(); break;
    case "tofiles": saveToFiles(); break;
    case "impick": document.getElementById("imp").click(); break;
    case "impgo": {S=norm(clone(ui.imp)); ui.imp=null; ui.impErr=""; TM={}; tmSave(); persist(true); render(); toast("Backup restored"); break;}
    case "impno": ui.imp=null; render(); break;
    case "bo": su.bestOf=([3,5].indexOf(+p[1])>=0)?+p[1]:1; persist(); render(); break;
    case "fin": if(FIN[p[1]]){su.finals=p[1]; persist(); render();} break;
    case "undog": undoGame(); break;
    case "hv": ui.hv=+p[1]; ui.hdel=false; render(); window.scrollTo(0,0); break;
    case "hvback": ui.hv=null; ui.hdel=false; render(); break;
    case "hdel": ui.hdel=true; render(); break;
    case "hdelno": ui.hdel=false; render(); break;
    case "hdelgo": if(S.history[ui.hv]) S.history.splice(ui.hv,1); ui.hv=null; ui.hdel=false; persist(true); render(); toast("Tournament removed"); break;
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.score!=null&&ui.draft){ui.draft["s"+el.dataset.score]=el.value.replace(/[^0-9]/g,""); ui.draft["t"+el.dataset.score]=true; if(el.value!==ui.draft["s"+el.dataset.score]) el.value=ui.draft["s"+el.dataset.score]; autoPick(); updWarn(); return;}
  const k=el.dataset.k; if(!k) return; const p=k.split(":");
  if(p[0]==="pd"){if(ui.pd) ui.pd[p[1]]=el.value; return;}
  if(p[0]==="name"){S.setup.name=el.value; const h=$("#h-title"); if(h) h.textContent=el.value||"Tournament";}
  else if(p[0]==="tname"){S.t.name=el.value; const h=$("#h-title"); if(h) h.textContent=el.value||"Tournament";}
  else if(p[0]==="team"){const tm=S.setup.teams.find(x=>x.id===p[1]); if(tm){tm[p[2]]=el.value; if(p[2]==="p1"||p[2]==="p2") tm[p[2]+"id"]="";} S.example=false; const sb=$("#setup-b"); if(sb) sb.innerHTML=setupB();}
  else if(p[0]==="tteam"){const tm=S.t.teams.find(x=>x.id===p[1]); if(tm) tm[p[2]]=el.value;}
  else if(p[0]==="players"){S.setup.players=el.value; const pc=$("#pcount"); if(pc) pc.textContent=pcountText(parseNames(el.value).length); const pb=document.querySelector('[data-act="pair"]'); if(pb) pb.disabled=parseNames(el.value).length<2;}
  persist(false);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="imp"){const f=el.files&&el.files[0];
    if(f){const r=new FileReader(); r.onload=()=>{try{const o=JSON.parse(r.result), st=o&&o.state; if(!st||!st.setup||!Array.isArray(st.roster)) throw new Error("bad"); ui.imp=st; ui.impErr="";}catch(x){ui.imp=null; ui.impErr="That file isn't a Beer Pong backup.";} render();}; r.readAsText(f);}
    el.value=""; return;}
  const sel=el.dataset&&el.dataset.sel;
  if(sel){
    if(sel==="nat"){if(ui.pd) ui.pd.nat=el.value; return;}
    const q=sel.split(":");
    if(q[0]==="slot"){const tm=S.setup.teams.find(x=>x.id===q[1]); if(tm){const pid=el.value, pl=rosterP(pid); tm[q[2]+"id"]=pid||""; tm[q[2]]=pl?pl.name:""; persist(); render();}}
    return;
  }
  const o=el.dataset&&el.dataset.opt; if(o){S.setup[o]=el.checked; persist(); render(); const n=document.getElementById("o-"+o); n&&n.focus();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(DR) drawClear(); else if(ui.sheet||ui.ps||ui.bk) closeSheet();}});

if(!["draw","score","results","players","setup"].includes(ui.tab)) ui.tab="setup";
setInterval(tick,500);
render();
connect();
})();
</script>
